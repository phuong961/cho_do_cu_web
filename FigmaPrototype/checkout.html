<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <div class="navbar">
            <a href="cart.html" style="font-size: 1.5rem; color: var(--text-color);">←</a>
            <h1>Thanh toán</h1>
            <div style="width: 24px;"></div>
        </div>

        <div style="flex: 1; padding: 1.5rem; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%;">
            <h3 class="mb-2">Thông tin vận chuyển</h3>
            <form id="checkoutForm">
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Tên người nhận" required value="Nguyễn Văn A">
                </div>
                <div class="input-group">
                    <input type="tel" class="input-field" placeholder="Số điện thoại" required value="0987654321">
                </div>
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Địa chỉ giao hàng" required
                        value="123 Đường ABC, Quận 1, TP.HCM">
                </div>
            </form>

            <h3 class="mt-3 mb-2">Tóm tắt đơn hàng</h3>
            <div style="background: var(--white); padding: 1rem; border-radius: 8px; box-shadow: var(--shadow);">
                <!-- Product Info Added Here -->
                <div
                    style="display: flex; gap: 10px; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #eee;">
                    <img id="c-image" src="" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px;">
                    <div>
                        <div id="c-name" style="font-weight: 600; font-size: 0.95rem;"></div>
                        <div id="c-qty" style="font-size: 0.85rem; color: var(--text-light);"></div>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="color: var(--text-light);">Tổng tiền hàng</span>
                    <span id="subtotal">0 đ</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="color: var(--text-light);">Phí vận chuyển</span>
                    <span style="color: #27ae60;">Miễn phí</span>
                </div>
                <hr style="margin: 0.5rem 0; border: none; border-top: 1px solid #eee;">
                <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem;">
                    <span>Tổng thanh toán</span>
                    <span id="total" style="color: var(--primary-color);">0 đ</span>
                </div>
            </div>
        </div>

        <div style="padding: 1.5rem; background: var(--white);">
            <button class="btn" onclick="confirmOrder()">Xác nhận đặt hàng</button>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Retrieve selected item
        const checkoutItem = State.getCheckoutItem();

        if (!checkoutItem) {
            alert('Vui lòng chọn sản phẩm để thanh toán!');
            window.location.href = 'cart.html';
        } else {
            const subtotal = checkoutItem.price * checkoutItem.quantity;
            document.getElementById('subtotal').innerText = formatPrice(subtotal);
            document.getElementById('total').innerText = formatPrice(subtotal);

            // Render Product Info
            document.getElementById('c-name').innerText = checkoutItem.name;
            document.getElementById('c-qty').innerText = "x" + checkoutItem.quantity;
            document.getElementById('c-image').src = checkoutItem.image;
        }

        function confirmOrder() {
            if (!checkoutItem) return;

            // Mock processing
            if (confirm('Xác nhận đặt hàng?')) {
                // Create Order Object
                const subtotal = checkoutItem.price * checkoutItem.quantity;
                const newOrder = {
                    id: Date.now().toString().slice(-6), // Simple mock ID
                    total: subtotal,
                    items: [checkoutItem], // Single item order
                    date: new Date().toISOString()
                };

                State.addOrder(newOrder);
                State.purchaseCheckoutItem(); // Remove only this item from cart
                alert('Đặt hàng thành công! Cảm ơn bạn đã mua sắm.');
                window.location.href = 'my_orders.html';
            }
        }
    </script>
</body>

</html>
