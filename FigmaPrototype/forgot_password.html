<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <div
            style="flex: 1; padding: 2rem; display: flex; flex-direction: column; justify-content: center; max-width: 450px; margin: 0 auto; width: 100%;">
            <div class="text-center mb-2">
                <h2>Khôi phục mật khẩu</h2>
                <p style="color: var(--text-light)">Nhập email để nhận hướng dẫn</p>
            </div>

            <form id="forgotForm">
                <div class="input-group">
                    <input type="email" class="input-field" placeholder="Email của bạn" required>
                </div>

                <button type="submit" class="btn mb-1">Gửi</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Quay
                    lại</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Đã gửi hướng dẫn khôi phục về email!');
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
