<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <div
            style="flex: 1; padding: 2rem; display: flex; flex-direction: column; justify-content: center; max-width: 450px; margin: 0 auto; width: 100%;">
            <div class="text-center mb-2">
                <div
                    style="width: 80px; height: 80px; background: #ffeaa7; border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem;">
                    🛍️</div>
                <h2>Chào mừng trở lại!</h2>
                <p style="color: var(--text-light)">Đăng nhập để tiếp tục</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" class="input-field" placeholder="Tên đăng nhập" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" class="input-field" placeholder="Mật khẩu" required>
                </div>

                <div style="text-align: right; margin-bottom: 1.5rem;">
                    <a href="forgot_password.html" style="font-size: 0.9rem;">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn">Đăng Nhập</button>
            </form>

            <div class="text-center mt-3">
                <p>Chưa có tài khoản? <a href="signup.html">Đăng Ký</a></p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (State.login(user, pass)) {
                window.location.href = 'home.html';
            } else {
                alert('Tên đăng nhập hoặc mật khẩu không đúng! (Gợi ý: User / 123456)');
            }
        });
    </script>
</body>

</html>
